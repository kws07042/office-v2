    </section>
    <section class="au-stage" data-variant="네이비 글라스" aria-label="네이비 글라스 시안" hidden>
      <div class="au-preview-controls"><span class="text-small">화면 보기</span><button class="btn" type="button" data-view="story" aria-pressed="true">대사</button><button class="btn" type="button" data-view="chat" aria-pressed="false">메신저</button><button class="btn" type="button" data-view="menu" aria-pressed="false">메뉴</button><button class="btn" type="button" data-view="save" aria-pressed="false">저장</button></div>
      <div class="au-product navy" data-design="navy" aria-label="네이비 글라스 게임 화면"></div>
    </section>
    <section class="au-stage" data-variant="살구 레터" aria-label="살구 레터 시안" hidden>
      <div class="au-preview-controls"><span class="text-small">화면 보기</span><button class="btn" type="button" data-view="story" aria-pressed="true">대사</button><button class="btn" type="button" data-view="chat" aria-pressed="false">메신저</button><button class="btn" type="button" data-view="menu" aria-pressed="false">메뉴</button><button class="btn" type="button" data-view="save" aria-pressed="false">저장</button></div>
      <div class="au-product peach" data-design="peach" aria-label="살구 레터 게임 화면"></div>
    </section>
  </div>
  <script>
  (()=>{
    const root=document.getElementById('afterwork-ui-directions');
    const people={ria:{name:'강리아',initial:'리',line:'오늘은 그냥 같이 걸을까?',reply:'좋아. 오늘은 네 얘기 더 듣고 싶어.',reaction:'나도. 그래서 먼저 물어봤어.'},jihyun:{name:'백지현',initial:'지',line:'오늘 저녁에는 일 얘기 말고. 시간 있어?',reply:'있어. 같이 저녁 먹자.',reaction:'좋아. 오늘은 천천히 이야기하자.'},yujin:{name:'차유진',initial:'유',line:'같이 듣고 싶은 곡이 있어요. 시간 괜찮으세요?',reply:'좋아요. 어떤 곡인지 궁금해요.',reaction:'듣고 나서 어떤 느낌인지 알려 주세요.'},seoyun:{name:'한서윤',initial:'서',line:'언제 한번 말고, 오늘. 시간 어때?',reply:'좋아. 오늘 같이 걷자.',reaction:'좋아. 이번엔 날짜까지 정한 약속이네.'}};
    const saved=window.openai?.widgetState?.privateContent?.directions||{};
    const states={};const renderers={};
    const persist=()=>window.openai?.setWidgetState?.({modelContent:{designStates:Object.fromEntries(Object.entries(states).map(([id,s])=>[id,{screen:s.screen,textSize:s.textSize}]))},privateContent:{directions:states}})?.catch(()=>{});
    const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
    const icons=()=>globalThis.lucide?.createIcons?.({attrs:{width:16,height:16}});
    root.querySelectorAll('.au-product').forEach(ui=>{
      const id=ui.dataset.design;const stage=ui.closest('.au-stage');const old=saved[id]||{};
      const state={screen:['story','chat','menu','save'].includes(old.screen)?old.screen:'story',person:people[old.person]?old.person:'ria',sent:old.sent===true,replyIndex:old.replyIndex===1?1:0,choiceIndex:old.choiceIndex===0||old.choiceIndex===1?old.choiceIndex:null,textSize:Number.isFinite(old.textSize)&&old.textSize>=18&&old.textSize<=26?old.textSize:21,radius:Number.isFinite(old.radius)?old.radius:(id==='cream'?24:id==='navy'?12:10),softLabels:old.softLabels!==false,reduceMotion:old.reduceMotion===true};
      states[id]=state;let timer=null;
      ui.innerHTML=`<div class="au-room" aria-hidden="true"><div class="au-window"><div class="au-city"></div></div><div class="au-desk"></div><div class="au-plant"></div></div>
      <header class="au-top"><div><div class="au-brand">퇴근 후, 우리</div><div class="au-place">금요일 퇴근길 · 18:40</div></div><div class="au-status"><span class="au-hearts" aria-label="호감도 다섯 칸 중 세 칸">♥♥♥<span>♡♡</span></span><span>썸</span><button class="au-mini cursor-interaction" data-go="chat" aria-label="메신저 열기" type="button">${icon('mail')}<span>메시지</span></button></div></header>
      <main class="au-story" data-pane="story"><div class="au-choices"><button class="au-choice cursor-interaction" data-choice="0" type="button">그럼 내가 아는 네가 하나 더 생기는 거지.</button><button class="au-choice cursor-interaction" data-choice="1" type="button">걷면서 얘기 좀 더 하자.</button></div><div class="au-dialogue"><div class="au-speaker">강리아</div><div class="au-line-text" aria-live="polite">회사에서 보는 거랑 많이 다르면?</div><nav class="au-footer" aria-label="대사 조작"><button class="cursor-interaction" data-dialog="history" type="button">기록</button><button class="cursor-interaction" data-dialog="auto" type="button">자동</button><button class="cursor-interaction" data-dialog="skip" type="button">스킵</button><button class="cursor-interaction" data-go="save" type="button">저장</button><button class="cursor-interaction" data-overlay="settings" type="button">설정</button><button class="cursor-interaction" data-go="menu" type="button">메뉴</button></nav></div></main>
      <section class="au-chat-view" data-pane="chat" hidden><div class="au-chat"><nav class="au-contacts" aria-label="연락처">${Object.entries(people).map(([key,p])=>`<button class="au-contact cursor-interaction" data-person="${key}" type="button" aria-pressed="${key===state.person}"><span class="au-avatar">${p.initial}</span>${p.name}</button>`).join('')}</nav><div class="au-chat-main"><div class="au-chat-heading"><div><div class="au-chat-person">강리아</div><div class="au-time">개인 메시지 · 오늘 20:18</div></div><button class="au-mini cursor-interaction" data-go="story" type="button" aria-label="메신저 닫기">${icon('x')}<span>닫기</span></button></div><div class="au-thread" aria-live="polite"><div class="au-bubble au-received"></div><div class="au-bubble"><span>다음엔 이 길도 같이 가 보자.</span><button class="au-photo cursor-interaction" data-overlay="photo" type="button" aria-label="산책길 첨부 확대"><span>초여름 산책길 ${icon('expand')}</span></button></div><div class="au-bubble mine" hidden></div><div class="au-typing" hidden><span>입력 중…</span><button class="au-mini cursor-interaction" data-skip-typing type="button">바로 보기</button></div><div class="au-bubble au-reaction" hidden></div></div><div class="au-replies"><button class="au-reply cursor-interaction" data-reply="0" type="button"></button><button class="au-reply cursor-interaction" data-reply="1" type="button">장소는 내가 골라 봐도 돼?</button></div></div></div></section>
      <section class="au-menu-view" data-pane="menu" hidden><div><h2 class="au-menu-title">퇴근 후, 우리</h2><div class="au-menu-tag">우리의 이야기는, 퇴근 후부터.</div></div><nav class="au-menu-buttons" aria-label="시작 메뉴"><button class="au-menu-button cursor-interaction" data-go="story" type="button">처음 시작</button><button class="au-menu-button cursor-interaction" data-go="save" type="button">이어하기</button><button class="au-menu-button cursor-interaction" data-overlay="settings" type="button">설정</button><button class="au-menu-button cursor-interaction" data-overlay="exit" type="button">종료</button></nav></section>
      <section class="au-save-view" data-pane="save" hidden><h2 class="au-save-title">어느 순간부터 이어갈까요?</h2><div class="au-slots"><button class="au-slot cursor-interaction" data-slot="0" type="button" aria-pressed="true"><span class="au-slot-thumb">리</span><span class="au-slot-copy">리아 · 네가 말했던 자리<small>금요일 저녁 · 카페<br>10.14 · 18:42</small></span></button><button class="au-slot cursor-interaction" data-slot="1" type="button" aria-pressed="false"><span class="au-slot-thumb">우</span><span class="au-slot-copy">다음 약속의 상대<small>공통 구간 · 퇴근길<br>10.14 · 17:36</small></span></button><button class="au-slot cursor-interaction" data-slot="2" type="button" aria-pressed="false"><span class="au-slot-thumb">＋</span><span class="au-slot-copy">비어 있는 슬롯<small>새로운 순간을 남겨 주세요.</small></span></button><button class="au-slot cursor-interaction" data-slot="3" type="button" aria-pressed="false"><span class="au-slot-thumb">＋</span><span class="au-slot-copy">비어 있는 슬롯<small>새로운 순간을 남겨 주세요.</small></span></button></div><div class="au-save-bottom"><button class="au-mini cursor-interaction" data-go="story" type="button">${icon('arrow-left')} 돌아가기</button><button class="au-action cursor-interaction" data-go="story" type="button">선택한 순간 이어하기</button></div></section>
      <div class="au-feedback" aria-live="polite"></div><div class="au-overlay" hidden role="dialog" aria-modal="true" aria-label="미리보기 대화상자"><div class="au-modal"></div></div>`;
      const q=s=>ui.querySelector(s);
      function render(){
        ui.style.setProperty('--au-text-size',state.textSize+'px');
        ui.style.setProperty('--au-radius',state.radius+'px');
        q('.au-top').hidden=state.screen==='menu';
        ui.querySelectorAll('[data-pane]').forEach(p=>p.hidden=p.dataset.pane!==state.screen);
        stage.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===state.screen)));
        q('.au-chat-person').textContent=people[state.person].name;
        q('.au-received').textContent=people[state.person].line;
        q('.au-thread .au-bubble:nth-child(2) > span').textContent=state.person==='yujin'?'다음엔 이 길도 같이 가요.':'다음엔 이 길도 같이 가 보자.';
        q('.au-place').textContent=state.screen==='chat'?'퇴근 후 개인 메시지 · 20:18':state.screen==='save'?'우리의 이야기 · 저장된 순간':'금요일 퇴근길 · 18:40';
        q('[data-reply="0"]').textContent=people[state.person].reply;
        q('[data-reply="1"]').textContent=state.person==='yujin'?'저도 추천하고 싶은 곡이 있어요.':'장소는 내가 골라 봐도 돼?';
        ui.querySelectorAll('[data-person]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.person===state.person)));
        q('.au-bubble.mine').hidden=!state.sent;
        q('.au-reaction').hidden=!state.sent;
        ui.querySelectorAll('[data-reply]').forEach(b=>b.hidden=state.sent);
        q('.au-bubble.mine').textContent=state.replyIndex===0?people[state.person].reply:q('[data-reply="1"]').textContent;
        q('.au-reaction').textContent=state.replyIndex===0?people[state.person].reaction:(state.person==='yujin'?'그러면 서로 한 곡씩 추천해요.':'좋아. 이번에는 네가 제안해 줘.');
        q('.au-line-text').textContent=state.choiceIndex===0?'그렇게 말하니까… 조금 기대하게 되네.':state.choiceIndex===1?'좋아. 오늘은 천천히 가자.':'회사에서 보는 거랑 많이 다르면?';
        ui.querySelectorAll('.au-brand,.au-speaker,.au-chat-person,.au-menu-title,.au-save-title').forEach(e=>e.style.fontFamily=state.softLabels?"'Gowun Dodum','Pretendard',sans-serif":"'Pretendard',sans-serif");
      }
      renderers[id]=render;render();
      function cancel(){clearTimeout(timer);timer=null;q('.au-typing').hidden=true;}
      function go(screen){cancel();state.screen=screen;q('.au-overlay').hidden=true;q('.au-feedback').textContent='';render();persist();}
      function finishReply(){cancel();state.sent=true;render();persist();}
      stage.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));
      ui.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
      ui.querySelectorAll('[data-person]').forEach(b=>b.addEventListener('click',()=>{cancel();state.person=b.dataset.person;state.sent=false;render();persist();}));
      ui.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{state.choiceIndex=Number(b.dataset.choice);render();persist();}));
      ui.querySelectorAll('[data-reply]').forEach(b=>b.addEventListener('click',()=>{cancel();state.replyIndex=Number(b.dataset.reply);q('.au-bubble.mine').textContent=b.textContent;q('.au-bubble.mine').hidden=false;ui.querySelectorAll('[data-reply]').forEach(e=>e.hidden=true);q('.au-typing').hidden=false;timer=setTimeout(finishReply,state.reduceMotion?0:900);}));
      q('[data-skip-typing]').addEventListener('click',finishReply);
      ui.querySelectorAll('[data-slot]').forEach(b=>b.addEventListener('click',()=>ui.querySelectorAll('[data-slot]').forEach(e=>e.setAttribute('aria-pressed',String(e===b)))));
      function overlay(kind){cancel();const modal=q('.au-modal');if(kind==='settings'){modal.innerHTML=`<h3>편하게 읽을 수 있도록</h3><label class="au-setting-row">글자 크기 <input type="range" min="18" max="26" value="${state.textSize}" aria-label="게임 대사 글자 크기"></label><label class="au-setting-row">효과 줄이기 <input type="checkbox" ${state.reduceMotion?'checked':''}></label><button class="au-action cursor-interaction" data-close type="button">돌아가기</button>`;modal.querySelector('input[type=range]').addEventListener('input',e=>{state.textSize=Number(e.target.value);render();persist();});modal.querySelector('input[type=checkbox]').addEventListener('change',e=>{state.reduceMotion=e.target.checked;persist();});}else if(kind==='photo'){modal.innerHTML='<h3>초여름 산책길</h3><div class="au-large-photo" aria-label="사진 확대 배치 예시"></div><button class="au-action cursor-interaction" data-close type="button">대화로 돌아가기</button>';}else{modal.innerHTML='<h3>오늘 이야기는 여기까지?</h3><button class="au-action cursor-interaction" data-close type="button">계속 이야기하기</button>';}modal.querySelector('[data-close]').addEventListener('click',()=>{q('.au-overlay').hidden=true;});q('.au-overlay').hidden=false;icons();}
      ui.querySelectorAll('[data-overlay]').forEach(b=>b.addEventListener('click',()=>overlay(b.dataset.overlay)));
      ui.querySelectorAll('[data-dialog]').forEach(b=>b.addEventListener('click',()=>{q('.au-feedback').textContent=b.dataset.dialog==='history'?'강리아: 회사에서 보는 거랑 많이 다르면?':b.dataset.dialog==='auto'?'자동 진행 표시 예시':'다음 대사로 이동하는 조작 예시';}));
      ui.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!q('.au-overlay').hidden){q('.au-overlay').hidden=true;return;}if(state.screen!=='story')go('story');}});
      if(globalThis.Tweak){const tweak=new Tweak({container:ui,onChange:render});tweak.addSlider(state,'textSize',{label:'대사 글자 크기',min:18,max:26,unit:'px',reference:'au.textSize'});tweak.addSlider(state,'radius',{label:'둥근 정도',min:4,max:30,unit:'px',reference:'au.radius'});tweak.addToggle(state,'softLabels',{label:'부드러운 이름표 글꼴'});}
    });
    icons();
    window.addEventListener('openai:set_globals',e=>{const next=e.detail?.globals?.widgetState?.privateContent?.directions;if(!next)return;for(const[id,value]of Object.entries(next)){if(!states[id])continue;if(['story','chat','menu','save'].includes(value.screen))states[id].screen=value.screen;if(Number.isFinite(value.textSize)&&value.textSize>=18&&value.textSize<=26)states[id].textSize=value.textSize;renderers[id]();}});
  })();
  </script>
</div>
