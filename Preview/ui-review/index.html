<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>퇴근 후, 우리 · UI 미리보기</title><style>body{margin:0;padding:24px;background:#f7f3ef}body>div{max-width:1100px;margin:auto}@font-face{font-family:Pretendard;src:url(../../Source/game/fonts/Pretendard-Regular.otf)}</style></head><body><div id="afterwork-review">
<style>
#afterwork-review{--ink:#3b0b22;--wine:#b3123f;--paper:#fffdfb;color:var(--ink);font:16px 'Pretendard', 'Malgun Gothic',sans-serif}#afterwork-review *{box-sizing:border-box}#afterwork-review button,#afterwork-review input{font:inherit}#afterwork-review button{cursor:pointer;color:inherit}#afterwork-review button:focus-visible{outline:3px solid #b3123f;outline-offset:4px}#afterwork-review .review-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}#afterwork-review .review-nav button{border:1px solid #b9a4ad;background:#fffdfb;border-radius:8px;padding:10px 16px}#afterwork-review button[aria-pressed=true]{background:var(--wine);color:#fffdfb}#afterwork-review .stage{background:#eee5e1;min-height:560px;aspect-ratio:16/9;position:relative;overflow:hidden;border-radius:12px}#afterwork-review .stage h1{font-size:34px;margin:0 0 18px;font-weight:700}#afterwork-review .stage h2{font-size:23px;margin:12px 0}#afterwork-review .stage p{line-height:1.65;margin:12px 0}#afterwork-review .topbar{background:var(--ink);color:#fffdfb;padding:18px 28px;display:flex;gap:18px;align-items:center;border-bottom:4px solid var(--wine)}#afterwork-review .topbar button{background:transparent;border:0;color:inherit;padding:8px}#afterwork-review .topbar button:first-child{margin-right:auto}#afterwork-review .records{display:grid;grid-template-columns:24% 1fr;gap:32px;padding:30px}#afterwork-review .records main{min-width:0}#afterwork-review .records aside{border-right:1px solid #bfb0a8;padding:12px 20px 0 0}#afterwork-review .records aside h1{font-size:32px}#afterwork-review .tabs{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px;border-bottom:1px solid #bfb0a8;margin-bottom:12px}#afterwork-review .tabs button{padding:10px 13px;border:0;background:transparent;border-radius:4px}#afterwork-review .copy{color:#6e4553;font-size:14px}#afterwork-review .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}#afterwork-review .stat{display:grid;grid-template-columns:80px 1fr 70px;gap:15px;align-items:center;margin:20px 0}#afterwork-review progress{width:100%;height:8px;accent-color:var(--wine)}#afterwork-review .pill{background:#fffdfb;border:2px solid var(--ink);border-radius:30px;padding:9px 17px;box-shadow:3px 3px 0 var(--ink)}#afterwork-review .panel{background:var(--paper);border:2px solid var(--ink);border-radius:24px;padding:24px;margin:24px auto;max-width:92%;box-shadow:4px 5px 0 var(--ink)}#afterwork-review .heading{display:flex;gap:16px;align-items:baseline}#afterwork-review em{font-family:Georgia,serif;color:var(--wine);font-weight:400}#afterwork-review .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}#afterwork-review .slot{background:#fffdfb;text-align:left;border:2px solid var(--ink);border-radius:4px;padding:9px;box-shadow:3px 3px 0 var(--ink);min-width:0}#afterwork-review .slot:disabled{color:var(--ink);cursor:default;box-shadow:none;border-color:#a48c96}#afterwork-review .thumb{height:100px;background:#e7dfd8;display:grid;place-items:center;color:#76616b;margin-bottom:8px}#afterwork-review .scene{background:linear-gradient(90deg,#eae5d9 12%,#d6e2e6 12%,#d6e2e6 45%,#f6eee4 45%,#f6eee4 47%,#cfdddf 47%,#cfdddf 86%,#eae5d9 86%)}#afterwork-review footer{display:flex;justify-content:flex-end;gap:12px;margin-top:18px}#afterwork-review .setting-layout{display:grid;grid-template-columns:190px 1fr;gap:30px}#afterwork-review .setting-layout aside{border-right:1px solid #bfb0a8;padding-right:20px}#afterwork-review .setting-layout aside button{display:block;margin:14px 0;width:100%}#afterwork-review .setting-content{min-height:380px;padding:12px}#afterwork-review label{display:flex;justify-content:space-between;gap:20px;align-items:center;margin:22px 0;line-height:1.5}#afterwork-review input[type=range]{accent-color:var(--wine);width:55%}#afterwork-review input[type=checkbox]{accent-color:var(--wine);width:22px;height:22px}#afterwork-review .story-list{display:grid;gap:8px}#afterwork-review .story-list button{border:0;border-bottom:1px solid #cbbab7;background:transparent;text-align:left;padding:15px}#afterwork-review .story-list button:disabled{color:#796971}#afterwork-review .empty{padding:30px 0;border-top:1px solid #bfb0a8;margin-top:20px}#afterwork-review .dialogue-scene{min-height:560px;display:flex;flex-direction:column;justify-content:flex-end;padding:32px;background:linear-gradient(180deg,transparent 70%,#d7c5b6 70%),linear-gradient(90deg,#e9e4da 14%,#d3e0e3 14%,#d3e0e3 48%,#f6eee7 48%,#f6eee7 50%,#d3e0e3 50%,#d3e0e3 86%,#e9e4da 86%)}#afterwork-review .dialogue-box{background:#fffdfb;padding:24px;border-top:5px dotted #bfb0a8}#afterwork-review .speaker{background:var(--ink);color:#fffdfb;display:inline-block;padding:9px 23px;border-radius:8px 8px 0 0}#afterwork-review .quick{display:flex;gap:16px;justify-content:flex-end;flex-wrap:wrap;margin-top:26px}#afterwork-review .quick button{border:0;background:transparent;color:#6e4553;padding:5px}#afterwork-review .phone{width:340px;max-width:95%;background:#b5c8d4;border:8px solid #332d35;border-radius:35px;margin:20px auto;overflow:hidden}#afterwork-review .phone-head{background:#e8eef1;padding:16px}#afterwork-review .messages{padding:20px;min-height:240px}#afterwork-review .bubble{padding:13px;background:#fffdfb;border-radius:4px 15px 15px;margin:12px 0;max-width:86%;line-height:1.5}#afterwork-review .bubble.me{background:#fee66e;margin-left:auto}#afterwork-review .reply{background:#f6f4f0;padding:14px;display:grid;gap:8px}#afterwork-review .reply button{background:#fffdfb;border:1px solid #b4b1b1;border-radius:8px;padding:10px;text-align:left}#afterwork-review .notice{min-height:22px;margin-top:12px;color:#6e4553;font-size:14px}#afterwork-review .log-entry{border-bottom:1px solid #e1d7cf;padding:12px 0}#afterwork-review .log-entry strong{color:var(--wine)}
@media(max-width:900px){#afterwork-review .stage{aspect-ratio:auto;min-height:560px}#afterwork-review .records{grid-template-columns:1fr;gap:12px;padding:20px}#afterwork-review .records aside{border:0;padding:0}#afterwork-review .records aside h1{margin:0}#afterwork-review .topbar{padding:10px;gap:5px;flex-wrap:wrap}#afterwork-review .topbar button{font-size:13px}#afterwork-review .setting-layout{grid-template-columns:1fr;gap:10px}#afterwork-review .setting-layout aside{border:0;display:flex;gap:8px;flex-wrap:wrap}#afterwork-review .setting-layout aside h1{width:100%}#afterwork-review .setting-layout aside button{width:auto;margin:0}#afterwork-review .slots{grid-template-columns:repeat(2,1fr)}#afterwork-review .panel{padding:16px}#afterwork-review .heading{flex-wrap:wrap;gap:8px}#afterwork-review .stage h1{font-size:28px}#afterwork-review .thumb{height:85px}#afterwork-review .dialogue-scene{padding:16px}#afterwork-review .stat{grid-template-columns:70px 1fr 65px;gap:6px}}
#afterwork-review .tabs button[aria-pressed=true]{background:#e9d8d5;color:#3b0b22}
@media(prefers-reduced-motion:reduce){#afterwork-review *{scroll-behavior:auto}}
</style>
<nav class="review-nav" aria-label="미리볼 화면"></nav>
<section class="stage" aria-label="퇴근 후, 우리 UI 미리보기"></section>
<p class="notice" aria-live="polite">예시 진행 상태를 사용한 인터랙티브 시안입니다. 실제 저장 데이터에는 영향을 주지 않습니다.</p>
<script>
(()=>{
const root=document.getElementById('afterwork-review');const stage=root.querySelector('.stage');const nav=root.querySelector('.review-nav');
const screens=['우리의 기록','저장','불러오기','설정','대화','메신저','대화 기록'];const people=['강리아','백지현','차유진','한서윤'];const stats=['편안함','존중','신뢰','진정성'];
const state={screen:'우리의 기록',tab:'관계',person:0,category:'전체',page:'1',setting:'글자',speed:40,previous:40,numbers:true,checkpoint:true,motion:true,typing:true,mute:false,music:65,effect:50,auto:45,window:'창모드',replied:false};
const saves={'1':['첫 출근은 현장으로',null,null,null,'다르게 읽은 단어',null]};
const btn=(label,action,active=false,cls='pill')=>`<button class="${cls}" data-action="${action}" aria-pressed="${active}">${label}</button>`;
function tabs(items,key,value){return `<div class="tabs">${items.map(x=>btn(x,key+':'+x,x===value,'')).join('')}</div>`}
function note(s){root.querySelector('.notice').textContent=s}
function render(){nav.innerHTML=screens.map(s=>btn(s,'screen:'+s,state.screen===s,'')).join('');
if(state.screen==='우리의 기록'){
let body='';const name=people[state.person];
if(state.tab==='관계')body=`<h2>${name} · ${stats[state.person]}</h2>${state.numbers?`<div class="stat"><span>호감도</span><progress max="100" value="64"></progress><span>64 / 100</span></div><div class="stat"><span>${stats[state.person]}</span><progress max="100" value="42"></progress><span>42 / 100</span></div>`:'<h2>서로 알아 가는 중</h2><p>함께 쌓아 가는 관계</p>'}<p class="copy">이 회차 4 / 16장면 · 전체 방문 6<br>함께 나눈 말과 실제 행동을 바탕으로 한 관계 기록이에요.</p><p>특별 장면 · 잠김</p><label>정확한 관계 수치 표시<input type="checkbox" data-field="numbers" ${state.numbers?'checked':''}></label><label>이야기 재진입용 자동 기록<input type="checkbox" data-field="checkpoint" ${state.checkpoint?'checked':''}></label><p class="copy">자동 기록은 장면마다 최근 한 개를 보관해요. 수동 저장 슬롯과 별개예요.</p>`;
if(state.tab==='이야기')body=`<h2>공통 이야기 → 개인 루트</h2><p class="copy">돌아가면 그 시점의 상태 전체를 불러와요.</p><div class="story-list">${['첫 출근은 현장으로','다르게 읽은 단어'].map(x=>btn('→ '+x,'restore:'+x,false,'')).join('')}<button disabled>잠김 · 아직 만나지 않은 이야기</button><button disabled>잠김 · 아직 만나지 않은 이야기</button></div>`;
if(state.tab==='CG · 회상')body=tabs(['전체','일반','연애','성인','특별','엔딩'],'category',state.category)+'<p class="copy">감상 0 / 등록 0</p><div class="empty"><h2>등록된 이미지가 아직 없어요.</h2><p>등록된 장면을 감상하면 여기에서 다시 볼 수 있어요.</p></div>';
if(state.tab==='결말')body='<h2>확인한 결말</h2><div class="story-list"><p>좋은 동료로, 우리</p><p class="copy">잠김 · 아직 확인하지 않은 결말</p></div>';
stage.innerHTML=`<div class="topbar">${btn('돌아가기','screen:대화',false,'')}${btn('설정','screen:설정',false,'')}${btn('대화 기록','screen:대화 기록',false,'')}${btn('저장·불러오기','screen:저장',false,'')}</div><div class="records"><aside><h1>우리의 기록</h1></aside><main>${tabs(['관계','이야기','CG · 회상','결말'],'tab',state.tab)}${tabs(people,'person',name)}${body}</main></div>`;
}else if(state.screen==='저장'||state.screen==='불러오기'){
const values=saves[state.page]||Array(6).fill(null);const loading=state.screen==='불러오기';
stage.innerHTML=`<div class="panel"><div class="heading"><h1>${state.screen}</h1><em>${loading?'Load':'Save'}</em><span class="copy">${loading?'이어서 읽을 장면을 고르세요.':'저장할 칸을 고르세요.'}</span></div>${tabs(loading?['1','2','3','4','5','6','자동','퀵']:['1','2','3','4','5','6'],'page',state.page)}<div class="slots">${values.map((v,i)=>`<button class="slot" data-action="slot:${i}" ${loading&&!v?'disabled':''}><div class="thumb ${v?'scene':''}">${v?'장면 미리보기':'비어 있음'}</div><strong>${i+1}</strong> <span class="copy">${v?'11월 18일 21:05':''}</span><p class="copy">${v||'빈 저장 칸'}</p></button>`).join('')}</div><footer>${btn(loading?'저장':'불러오기','screen:'+(loading?'저장':'불러오기'))}${btn('돌아가기','screen:대화')}</footer></div>`;
}else if(state.screen==='설정'){
const slider=(label,key)=>`<label>${label}<input aria-label="${label}" type="range" min="0" max="100" value="${state[key]}" data-field="${key}"></label>`;
const toggle=(label,key)=>`<label>${label}<input aria-label="${label}" type="checkbox" data-field="${key}" ${state[key]?'checked':''}></label>`;
let content=state.setting==='글자'?slider('글자 표시 속도','speed')+slider('자동 진행 대기 시간','auto')+`<label>글자 즉시 표시<input type="checkbox" data-field="instant" ${state.speed===0?'checked':''}></label><p class="copy">스위치를 끄면 이전 글자 속도로 돌아갑니다.</p>`:state.setting==='소리'?slider('배경 음악','music')+slider('효과음','effect')+toggle('전체 소리 끄기','mute'):state.setting==='연출'?toggle('화면 움직임 효과','motion')+toggle('메신저 입력 중 연출','typing'):tabs(['창모드','전체화면'],'window',state.window)+'<p class="copy">전체화면은 F11 키로도 바꿀 수 있어요.</p>';
stage.innerHTML=`<div class="panel setting-layout"><aside><h1>설정</h1>${['화면','글자','소리','연출'].map(x=>btn(x,'setting:'+x,state.setting===x)).join('')}</aside><main class="setting-content"><h2>${state.setting}</h2>${content}<footer>${btn('돌아가기','screen:대화')}</footer></main></div>`;
}else if(state.screen==='메신저')stage.innerHTML=`<div class="phone"><div class="phone-head"><small>21:05</small><h2>강리아</h2></div><div class="messages"><span class="copy">강리아</span><div class="bubble">오늘 같이 걸어서 좋았어.</div><div class="bubble">집에는 잘 들어갔어?</div>${state.replied?'<div class="bubble me">응, 잘 들어왔어. 너는?</div>':''}</div><div class="reply">${state.replied?'<span class="copy">답장을 보냈어요.</span>':btn('응, 잘 들어왔어. 너는?','reply',false,'')}${btn('닫기','screen:대화',false,'')}</div></div>`;
else if(state.screen==='대화 기록')stage.innerHTML=`<div class="panel"><div class="heading"><h1>대화 기록</h1><em>Log</em></div>${['그래도 우연히 그 포인트를 집네.','같이 확인하면 더 빨리 찾을 수 있겠네요.','그럼 여기부터 다시 볼까?'].map((t,i)=>`<div class="log-entry"><strong>${i===1?'도현':'한서윤'}</strong><p>${t}</p></div>`).join('')}<footer>${btn('돌아가기','screen:대화')}</footer></div>`;
else stage.innerHTML=`<div class="dialogue-scene"><div><span class="speaker">한서윤 <em>Han Seoyun</em></span><div class="dialogue-box"><p>그래도 우연히 그 포인트를 집네.</p><div class="quick">${['대화 기록','저장','불러오기','설정','우리의 기록','메신저'].map(x=>btn(x,'screen:'+x,false,'')).join('')}</div></div></div></div>`;
}
root.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const [key,value]=el.dataset.action.split(':');if(key==='person')state.person=people.indexOf(value);else if(key==='slot'){if(state.screen==='저장'){saves[state.page]??=Array(6).fill(null);saves[state.page][Number(value)]='다르게 읽은 단어';note('미리보기 저장 칸을 채웠습니다.');}else note('선택한 저장을 불러오는 동작의 미리보기입니다.');}else if(key==='restore')note(value+' 시점으로 돌아가는 동작의 미리보기입니다.');else if(key==='reply')state.replied=true;else state[key]=value;if(key==='screen'&&value==='저장'&&['자동','퀵'].includes(state.page))state.page='1';render();});
root.addEventListener('change',e=>{const key=e.target.dataset.field;if(!key)return;if(key==='instant'){if(e.target.checked){state.previous=state.speed||state.previous;state.speed=0;}else state.speed=state.previous;}else state[key]=e.target.type==='checkbox'?e.target.checked:Number(e.target.value);render();});render();
})();
</script>
</div>
</body></html>
