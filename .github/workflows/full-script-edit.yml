name: Full script edit validation
on:
  push:
    branches: [story/full-script-edit]
    paths:
      - Source/game/**
      - Source/tests/full_script_contract.py
      - .github/workflows/full-script-edit.yml
permissions:
  contents: read
env:
  SDL_AUDIODRIVER: dummy
  RENPY_RENDERER: sw
jobs:
  contracts-and-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tasks: ${{ steps.changes.outputs.tasks }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks for the changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          tasks='["targeted","full-playthroughs","package"]'
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null && git diff --quiet "$BASE_SHA" HEAD -- Source/game Source/tests; then
            tasks='["package"]'
          fi
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
      - name: Compare story and state contracts with merged main
        run: python3 Source/tests/full_script_contract.py
      - name: Fetch verified official SDK
        run: |
          curl --fail --location --retry 2 https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2 -o "$RUNNER_TEMP/renpy-sdk.tar.bz2"
          echo "eb0a9be7f0fb13632fe25ceade9a8bed5a1b4d6b6e83bd19eeeb29e1a1bb4a45  $RUNNER_TEMP/renpy-sdk.tar.bz2" | sha256sum --check
          tar -xjf "$RUNNER_TEMP/renpy-sdk.tar.bz2" -C "$RUNNER_TEMP"
          echo "SDK=$RUNNER_TEMP/renpy-8.5.3-sdk" >> "$GITHUB_ENV"
          echo "VALIDATION=$RUNNER_TEMP/full-script-edit" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/full-script-edit"
      - name: RenPy lint
        run: |
          set +e
          xvfb-run -a "$SDK/renpy.sh" "$GITHUB_WORKSPACE/Source" lint --error-code > "$VALIDATION/lint.log" 2>&1
          status=$?
          set -e
          cat "$VALIDATION/lint.log"
          exit "$status"
      - name: Preserve contract and lint records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-script-edit-contract
          path: |
            Source/testing/full-script-edit/contract.json
            ${{ runner.temp }}/full-script-edit/lint.log
          retention-days: 7
  verify:
    needs: contracts-and-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.contracts-and-lint.outputs.tasks) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch verified official SDK
        run: |
          curl --fail --location --retry 2 https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2 -o "$RUNNER_TEMP/renpy-sdk.tar.bz2"
          echo "eb0a9be7f0fb13632fe25ceade9a8bed5a1b4d6b6e83bd19eeeb29e1a1bb4a45  $RUNNER_TEMP/renpy-sdk.tar.bz2" | sha256sum --check
          tar -xjf "$RUNNER_TEMP/renpy-sdk.tar.bz2" -C "$RUNNER_TEMP"
          echo "SDK=$RUNNER_TEMP/renpy-8.5.3-sdk" >> "$GITHUB_ENV"
          echo "VALIDATION=$RUNNER_TEMP/full-script-edit" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/full-script-edit"
      - name: Native story checks
        if: matrix.task != 'package'
        env:
          TASK: ${{ matrix.task }}
        run: |
          if [ "$TASK" = "targeted" ]; then
            suites="script_polish_checks work_mini_checks common_romance review_continuity_checks full_editorial_checks yujin_final_checks"
          else
            suites="integrated_story_checks marriage_disclosure_checks"
          fi
          for suite in $suites; do
            echo "RUNNING_SUITE=$suite"
            set +e
            xvfb-run -a "$SDK/renpy.sh" "$GITHUB_WORKSPACE/Source" test "$suite" --savedir "$RUNNER_TEMP/saves-$suite" --overwrite-screenshots --report-detailed > "$VALIDATION/$suite.stdout.log" 2>&1
            status=$?
            set -e
            if [ -f Source/log.txt ]; then cp Source/log.txt "$VALIDATION/$suite.log"; fi
            cat "$VALIDATION/$suite.stdout.log"
            tail -n 18 "$VALIDATION/$suite.log"
            if [ "$status" -ne 0 ]; then exit "$status"; fi
          done
      - name: Clean Windows build and package contents
        if: matrix.task == 'package'
        run: |
          set +e
          xvfb-run -a "$SDK/renpy.sh" "$SDK/launcher" distribute "$GITHUB_WORKSPACE/Source" --destination "$VALIDATION/builds" --package win > "$VALIDATION/build.log" 2>&1
          status=$?
          set -e
          cat "$VALIDATION/build.log"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path(os.environ["VALIDATION"])
          package=next((root/"builds").glob("*-win.zip"))
          with zipfile.ZipFile(package) as z:
              names=z.namelist()
              assert z.testzip() is None
              assert any(n.endswith("/game/work_minis.rpyc") for n in names)
              assert any(n.endswith("/afterwork_script_prototype.exe") for n in names)
              assert not any(n.endswith(("_tests.rpyc","testcases.rpyc","renpy_agent.rpyc",".save","security_keys.txt")) for n in names)
              project_paths=["/".join(pathlib.PurePosixPath(n).parts[1:]) for n in names]
              forbidden=[n for n in project_paths if n.startswith(("game/saves/","art/","tests/","testing/","game/tests/","game/testing/"))]
              assert not forbidden, forbidden
              assert not any(n.endswith(".rpy") and "/renpy/common/" not in n for n in names)
              result={"source_commit":os.environ["GITHUB_SHA"],"file":package.name,"sha256":hashlib.sha256(package.read_bytes()).hexdigest(),"bytes":package.stat().st_size,"files":len(names),"official_sdk":"8.5.3","game_scripts_and_executable_present":True,"project_development_files_and_saves_excluded":True,"windows_executable_run":False}
              (root/"build-verification.json").write_text(json.dumps(result,indent=2))
              print("BUILD_VERIFICATION_JSON="+json.dumps(result))
          PY
      - name: Preserve validation records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-script-edit-${{ matrix.task }}
          path: |
            ${{ runner.temp }}/full-script-edit/
            Source/tests/screenshots/
            Source/errors.txt
            Source/traceback.txt
          if-no-files-found: warn
          retention-days: 7
